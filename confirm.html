<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexDay — Confirmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #FAF3E8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      padding: 2rem;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .line-accent {
      width: 1px;
      height: 56px;
      background: linear-gradient(to bottom, transparent, #C6A85A);
      margin-bottom: 2rem;
    }

    .bookmark {
      width: 40px;
      margin-bottom: 1.5rem;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #6B988D;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(32px, 8vw, 42px);
      font-weight: 300;
      color: #2C2416;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    h1 em {
      font-style: italic;
      color: #6B988D;
    }

    .subtitle {
      font-size: 14px;
      color: #7a6e5e;
      line-height: 1.75;
      font-weight: 300;
      margin-bottom: 2rem;
      max-width: 320px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-radius: 40px;
      margin-bottom: 1.25rem;
      border: 0.5px solid rgba(107,152,141,0.35);
      background: rgba(107,152,141,0.1);
    }

    .status-pill.error {
      background: rgba(201,122,90,0.08);
      border-color: rgba(201,122,90,0.3);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6B988D;
      flex-shrink: 0;
    }

    .dot.loading { animation: pulse 1.4s ease-in-out infinite; }
    .dot.error { background: #c97a5a; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(0.8); }
    }

    .status-text {
      font-size: 13px;
      color: #6B988D;
    }

    .status-text.error { color: #c97a5a; }

    .fallback {
      font-size: 12px;
      color: #a89880;
      margin-top: 0.25rem;
    }

    .fallback a {
      color: #6B988D;
      text-decoration: none;
      border-bottom: 0.5px solid #6B988D80;
      padding-bottom: 1px;
    }

    .divider {
      width: 36px;
      height: 1px;
      background: #C6A85A;
      opacity: 0.4;
      margin-top: 2.5rem;
      margin-bottom: 0.75rem;
    }

    .wordmark {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: #c4b49e;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="grain"></div>

  <div class="card">
    <div class="line-accent"></div>

    <!-- Bookmark logo — depuis Supabase Storage -->
    <img class="bookmark" src="https://nzbhmshkcwudzydeahrq.supabase.co/storage/v1/object/public/asset/Image/Logo-LexDay.svg" alt="LexDay" />

    <div class="eyebrow" id="eyebrow">Confirmation de compte</div>
    <h1 id="title">Bienvenue dans <em>LexDay</em></h1>
    <p class="subtitle" id="subtitle">Ton adresse email a été confirmée. L'application va s'ouvrir automatiquement…</p>

    <div class="status-pill" id="pill">
      <div class="dot loading" id="dot"></div>
      <span class="status-text" id="status-text">Ouverture de l'application…</span>
    </div>

    <div class="fallback" id="fallback">
      L'app ne s'ouvre pas ? <a href="#" id="manual-link">Appuyer ici</a>
    </div>

    <div class="divider"></div>
    <div class="wordmark">LEXDAY</div>
  </div>

  <script>
    // ── Parse URL params ────────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const hash   = new URLSearchParams(window.location.hash.slice(1));

    const tokenHash   = params.get('token_hash');
    const type        = params.get('type') || 'signup';
    const accessToken = hash.get('access_token');
    const refreshToken= hash.get('refresh_token');

    // Build the deep link for the app
    let deepLink = 'lexday://auth/callback';

    if (tokenHash) {
      deepLink += `?token_hash=${encodeURIComponent(tokenHash)}&type=${encodeURIComponent(type)}`;
    } else if (accessToken) {
      deepLink += `#access_token=${encodeURIComponent(accessToken)}&refresh_token=${encodeURIComponent(refreshToken || '')}&type=${encodeURIComponent(type)}`;
    }

    document.getElementById('manual-link').href = deepLink;

    // ── Redirect logic ──────────────────────────────────────────────────────
    function showError() {
      document.getElementById('eyebrow').textContent = 'Lien expiré';
      document.getElementById('title').innerHTML = 'Ce lien <em>n\'est plus valide</em>';
      document.getElementById('subtitle').textContent = 'Le lien de confirmation a expiré ou a déjà été utilisé. Demande un nouveau lien depuis l\'application.';
      document.getElementById('dot').className = 'dot error';
      document.getElementById('status-text').textContent = 'Lien invalide ou expiré';
      document.getElementById('status-text').className = 'status-text error';
      document.getElementById('pill').className = 'status-pill error';
      document.getElementById('fallback').innerHTML = '<a href="lexday://">Retourner à l\'application</a>';
    }

    if (!tokenHash && !accessToken) {
      // No token at all — likely direct visit or expired link
      showError();
    } else {
      // Attempt deep link redirect
      window.location.href = deepLink;

      // After 2.5s, if still on page, show fallback
      setTimeout(() => {
        document.getElementById('dot').className = 'dot';
        document.getElementById('status-text').textContent = 'L\'application n\'a pas répondu';
        document.getElementById('fallback').innerHTML =
          'Appuie sur le lien ci-dessous pour ouvrir LexDay :<br><br>' +
          '<a href="' + deepLink + '" style="font-size:13px;font-weight:500;">Ouvrir LexDay →</a>';
      }, 2500);
    }
  </script>
</body>
</html>
